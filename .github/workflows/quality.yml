name: Calidad

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Preparar proyecto
        run: npm ci
      - name: Diagnóstico Astro y TypeScript
        run: npm run check
      - name: Lint Astro, TypeScript y herramientas
        run: npm run lint
      - name: Formato reproducible
        run: npm run format:check
      - name: Preparar Chromium de pruebas
        run: npx playwright install --with-deps chromium
      - name: Build, integración y flujos en navegador
        run: npm test
      - name: Comprobar formato del diff
        run: git diff --check
      - name: Evidencia si falla una prueba
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pruebas-navegador-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
